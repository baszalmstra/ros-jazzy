    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros2-ament-package ros2-ament-cmake-core ros2-ros-workspace ros2-ros-environment
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-ament-package ros2-ament-cmake-core ros2-ros-workspace
          ros2-ros-environment
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
